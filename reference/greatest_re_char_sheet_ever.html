<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Resident Evil Character Sheet</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Distressed&amp;family=Metal+Mania&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS CDN - Added for consistency with new elements, though custom CSS is dominant -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Metal Mania', cursive;
            /* Applied Metal Mania globally */
            margin: 0;
            background-color: #3f3f3f;
            /* Dark grey background */
            display: flex;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #000;
            /* Default text color to black for most elements */
            font-size: 12.54px;
            /* Decreased overall font size by 5% (13.2px * 0.95 = 12.54px) */
            min-height: 100vh;
            /* Ensure background extends to full viewport height */
            /* Added subtle white glow to all black text */
            text-shadow: 0 0 2px #ffffff, 0 0 2px #ffffff;
        }

        .character-sheet-container {
            width: 800px;
            /* Fixed width based on the image's aspect ratio */
            height: 100%;
            /* Increased overall height */
            border: 1px solid #000;
            /* Enhanced background for old paper effect with more prominent stains/wrinkles */
            background-color: #f7e6c7;
            /* Old paper base color (light cream/tan) */
            background-image:
                /* Large, faint stain in top-left */
                radial-gradient(circle at 15% 20%, rgba(139, 69, 19, 0.05) 0%, rgba(139, 69, 19, 0) 70%),
                /* Medium, slightly darker stain mid-right */
                radial-gradient(circle at 70% 45%, rgba(139, 69, 19, 0.07) 0%, rgba(139, 69, 19, 0) 60%),
                /* Small, faint stain bottom-left */
                radial-gradient(circle at 30% 85%, rgba(139, 69, 19, 0.04) 0%, rgba(139, 69, 19, 0) 50%),
                /* New: Darker, aged blood/coffee stain top-right */
                radial-gradient(ellipse at 85% 10%, rgba(70, 20, 0, 0.1) 0%, rgba(70, 20, 0, 0) 70%),
                /* New: More irregular, darker spot mid-left */
                radial-gradient(circle at 20% 60%, rgba(70, 20, 0, 0.12) 0%, rgba(70, 20, 0, 0) 65%),
                /* New: Elongated, subtle wrinkle/crease simulation (linear-gradient) */
                linear-gradient(145deg, rgba(0, 0, 0, 0.03) 0%, rgba(0, 0, 0, 0) 30%),
                /* Another subtle wrinkle */
                linear-gradient(35deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0) 25%);
            background-repeat: no-repeat;
            background-size: 250px 250px, 180px 180px, 100px 100px, 120px 80px, 90px 90px, 100% 100px, 100% 80px;
            /* Sizes for each stain and wrinkle */
            background-position: 15% 20%, 70% 45%, 30% 85%, 85% 10%, 20% 60%, 0% 10%, 0% 70%;
            /* Positions for each background layer */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 5px;
            /* Gap between major sections */
            padding: 10px;
        }

        .header {
            background-color: rgba(100, 100, 100, 1);
            /* This is now the grey outline color */
            padding: 5px 1px;
            /* Creates the grey border on top/bottom (5px) and sides (1px) */
            font-weight: bold;
            position: relative;
            /* For positioning the Umbrella logos */
            height: auto;
            /* Let height adjust based on content and padding */
            box-sizing: border-box;
            /* Include padding in dimensions */
            display: flex;
            /* Use flex to align content within the border */
            align-items: center;
            /* Vertically center the .title-bar inside */
            justify-content: center;
            /* Horizontally center the .title-bar inside */
            box-shadow: none;
            /* Removed previous box-shadow for a clean border */
        }

        .header .title-bar {
            background-color: #2b2b2b;
            /* The inner dark grey bar */
            flex-grow: 1;
            /* Allows it to fill the available space within .header */
            height: 100%;
            /* Fill available height within the header padding */
            display: flex;
            flex-direction: column;
            /* Stack main title and subtitle */
            align-items: center;
            /* Center horizontally */
            justify-content: center;
            /* Center vertically */
            position: relative;
            /* Essential for positioning the subtitle inside */
            overflow: hidden;
            /* Prevent text from spilling out if sizing is off */
        }

        .header .title-bar span {
            font-family: 'Rubik Distressed', sans-serif;
            /* FIXED: Corrected font name here */
            font-size: 30px;
            /* Precise font size for "RESIDENT EVIL" */
            letter-spacing: 2px;
            text-shadow: 0px 2px 5px rgba(200, 200, 200, 0.8);
            /* Silver glow */
            background: linear-gradient(to right, #ccc, #fff, #ccc);
            /* Gradient text */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            /* Required for transform */
            transform: skewX(-15deg) translateY(-5px);
            /* Keep original Y for main title */
            white-space: nowrap;
            /* Prevent wrapping */
        }

        .header .subtitle {
            font-family: 'Metal Mania', cursive;
            font-size: 13px;
            /* Precise font size for subtitle */
            font-weight: normal;
            color: #ccc;
            position: absolute;
            /* Absolute positioning relative to .title-bar */
            bottom: -5px;
            /* Adjusted to move it further down and prevent overlap */
            left: 50%;
            transform: translateX(-50%);
            /* Adjusted back to standard centering */
            white-space: nowrap;
            /* Prevent wrapping */
            text-shadow: 0 0 2px #555;
            /* Darker, subtle shadow for subtitle */
            z-index: 2;
            /* Ensure it's above the main title's background/shadow if needed */
        }

        /* Base style for the Umbrella logo SVG container */
        .umbrella-logo-svg {
            position: absolute;
            /* Position relative to the .header (its parent) */
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            /* Reduced from 40px */
            height: 32px;
            /* Reduced from 40px */
            z-index: 2;
            /* Added grey glow */
            box-shadow: 0 0 8px rgba(150, 150, 150, 0.7);
            /* Grey glow effect */
            border-radius: 50%;
            /* Apply border-radius to contain the shadow */
        }

        .umbrella-logo-left {
            left: 10px;
        }

        .umbrella-logo-right {
            right: 10px;
        }

        /* Info grid styling for the new 2-column layout + photo */
        .info-grid {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 0.8fr;
            /* Two data columns, one photo column */
            gap: 2px;
            background-color: #888;
            /* Border color for the grid */
            padding: 1px;
            border: 1px solid #555;
        }

        /* Styling for individual info items within the new columns */
        .info-item {
            background-color: #c0c0c0;
            /* Reverted to original light grey */
            padding: 2px 5px;
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            border: 1px solid #a0a0a0;
            /* Cell border */
            box-sizing: border-box;
            /* Ensure no aged effect here */
            background-image: none;
            background-repeat: initial;
            background-size: initial;
            background-position: initial;
        }

        /* Container for left and right info columns */
        .info-column-left,
        .info-column-right {
            display: flex;
            flex-direction: column;
            gap: 2px;
            /* Gap between info items vertically */
            background-color: #888;
            /* Matches info-grid border for seamless look */
            padding: 0;
            /* No padding here as info-item has it */
        }

        .info-grid label {
            font-weight: bold;
            margin-right: 5px;
            white-space: nowrap;
        }

        .info-grid input[type="text"],
        .info-grid input[type="number"] {
            flex-grow: 1;
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            outline: none;
            padding: 0 2px;
            font-size: 14px;
            /* Increased from 12.54px */
            color: #000;
        }

        /* Photo box styling */
        .photo-box {
            grid-column: 3 / 4;
            /* Span the last column */
            grid-row: 1 / span 6;
            /* Span all rows of info grid */
            background-color: #e0e0e0;
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            /* To stack text and image */
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            font-size: 0.9em;
            /* This will scale relative to the new body font-size */
            font-style: italic;
            overflow: hidden;
            /* Ensure content doesn't spill */
            position: relative;
            cursor: pointer;
            /* Indicate it's clickable */
        }

        .photo-box img {
            width: 100%;
            /* Make image take full width of container */
            height: 190px;
            /* Make image take full height of container */
            object-fit: cover;
            /* This will make the image fill the box, cropping if necessary */
            display: block;
            /* Remove extra space below image */
            margin: auto;
            /* Center image within box */
        }

        .photo-box p {
            /* Style for the "Click to upload photo" text */
            margin: 0;
            padding: 5px;
            color: #555;
        }


        /* Section styling */
        .section-title {
            background-color: #7a7a7a;
            color: #fff;
            padding: 3px 10px;
            margin-top: 5px;
            /* Increased font size for main section titles */
            font-size: 1.2em;
            /* Adjusted from 1.1em */
            font-weight: bold;
            /* Increased border width and darker color */
            border: 2px solid #333;
            /* Changed from 1px solid #555 */
            position: relative;
            text-shadow: 1px 1px 1px #000;
            display: flex;
            /* Use flexbox to align icon and text */
            align-items: center;
            gap: 8px;
            /* Space between icon and text */
        }

        .section-title .icon {
            /* Common class for all icons in section titles */
            width: 18px;
            /* Reduced from 24px */
            height: 18px;
            /* Reduced from 24px */
            fill: #fff;
            /* Color of the icon */
            flex-shrink: 0;
            /* Prevent icon from shrinking */
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7));
            /* Add a subtle white glow */
        }

        /* Updated section content styling */
        .section-content {
            background-color: #e6d3b3;
            /* Lighter cream for main content sections */
            border: 1px solid #888;
            padding: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            /* Gap between columns */
            background-image:
                linear-gradient(20deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0) 30%),
                radial-gradient(circle at 90% 10%, rgba(139, 69, 19, 0.03) 0%, rgba(139, 69, 19, 0) 60%);
            background-repeat: no-repeat;
            background-size: 100% 100%, 80px 80px;
            background-position: 0% 0%, 90% 10%;
        }

        .column-header {
            background-color: #7a7a7a;
            color: #fff;
            padding: 2px 0;
            text-align: center;
            font-weight: bold;
            /* Increased border width and darker color */
            border: 2px solid #333;
            /* Changed from 1px solid #555 */
            margin-bottom: 2px;
            position: relative;
            display: flex;
            /* Use flexbox to align icon and text */
            align-items: center;
            justify-content: center;
            /* Center content including icon */
            gap: 5px;
            /* Space between icon and text */
            text-shadow: 1px 1px 1px #000;
            /* Added text shadow here */
            /* Increased font size for column headers */
            font-size: 1.2em;
            /* Adjusted from 1.1em */
        }

        .column-header .icon {
            /* Common class for all icons in column headers */
            width: 14px;
            /* Still good for these smaller ones */
            height: 14px;
            /* Still good for these smaller ones */
            fill: #fff;
            /* Color of the icon */
            flex-shrink: 0;
        }

        .weapon-row .icon {
            width: 16px;
            /* Reduced from 20px */
            height: 16px;
            /* Reduced from 20px */
            fill: #000;
            /* Weapon icons should be black */
            margin-right: 3px;
            vertical-align: middle;
        }

        /* Pistol icon (new) */
        .pistol-icon {
            background-color: transparent;
        }

        .pistol-icon path {
            fill: #000;
        }

        /* Original knife icon (retained for generic weapon, if needed elsewhere) */
        .knife-icon {
            background-color: transparent;
        }

        .knife-icon path {
            fill: #000;
        }

        /* Original gun icon (retained for generic weapon, if needed elsewhere) */
        .gun-icon {
            background-color: transparent;
        }

        .gun-icon path {
            fill: #000;
        }

        /* SVG for sword/melee icon */
        .melee-icon {
            background-color: transparent;
        }

        .melee-icon path {
            fill: #000;
        }

        /* SVG for special weapon icon (star) */
        .special-weapon-icon {
            background-color: transparent;
        }

        .special-weapon-icon path {
            fill: #000;
        }

        /* Updated attribute/ability/advantage column styling */
        .attribute-column,
        .ability-column,
        .advantage-column {
            background-color: #f0e6d6;
            /* Very light cream for sub-columns */
            padding: 3px;
            border: 1px solid #a0a0a0;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(80deg, rgba(0, 0, 0, 0.01) 0%, rgba(0, 0, 0, 0) 40%),
                radial-gradient(circle at 25% 75%, rgba(139, 69, 19, 0.02) 0%, rgba(139, 69, 19, 0) 50%);
            background-repeat: no-repeat;
            background-size: 100% 100%, 50px 50px;
            background-position: 0% 0%, 25% 75%;
        }

        /* Attribute items: Ensure label is left, dots are right */
        .attribute-item,
        .virtue-item {
            display: flex;
            align-items: center;
            padding: 1px 0;
            justify-content: space-between;
            /* This ensures label is left, dots are right */
        }

        /* Inner flex container for cost display and dots */
        .dots-and-cost-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            /* Align to the right for text-align: right */
            flex-shrink: 0;
            /* Prevent from shrinking */
        }

        /* Next Level Cost Display for Attributes and Abilities */
        .next-level-cost-display {
            font-size: 0.7em;
            /* Slightly smaller font for cost */
            color: #555;
            /* Slightly muted color */
            text-align: right;
            /* Align text to the right */
            /* Removed width: 100% from here to allow it to shrink if needed by flex,
           and rely on flex-grow for spacing. */
            white-space: nowrap;
            /* Prevent wrapping */
            margin-bottom: 0px;
            /* Reduced space between cost and dots */
            margin-left: auto;
            /* Push to the right within flex container */
            text-shadow: none;
            /* No white glow on this text */
            height: 1.1em;
            /* Ensure consistent height for spacing */
            line-height: 1.1em;
            /* Vertically center text in its line height */
        }

        /* Dots container for XP-costing attributes/abilities */
        .dots {
            display: flex;
            flex-shrink: 0;
            /* Prevent dots from shrinking */
            margin-top: 0px;
            /* Push dots up slightly */
        }

        /* Base styling for all XP-costing dots (attributes/abilities) */
        .dots input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: #fff;
            /* White for unchecked dots */
            border-radius: 50%;
            width: 9px;
            /* Slightly smaller dot size */
            height: 9px;
            /* Slightly smaller dot size */
            margin: 0 1px;
            /* Reduced margin to bring dots closer */
            cursor: pointer;
            border: 1px solid #000;
            /* Black border for unchecked dots */
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
            /* Added transitions */
        }

        /* Active (filled) state for XP-costing dots */
        .dots input[type="checkbox"].active {
            background-color: #000;
            /* Black for checked/active dots */
            border-color: #eee;
            /* Lighter border for checked */
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
            /* Subtle glow for active */
        }

        /* Current level highlight for XP-costing dots (specific border) */
        .dots input[type="checkbox"].current-level {
            border: 2px solid #f59e0b;
            /* Yellow/orange border for current level */
        }

        /* Specific adjustment for ability dots */
        /* Removed specific margin here, using general .dots input[type="checkbox"] */
        /* .ability-item .dots input[type="checkbox"] {
        margin: 0 0.5px;
    } */

        .dots input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        .dots input[type="checkbox"].active:hover {
            transform: scale(1.15);
        }

        /* Virtue dots (no XP cost) - distinctive styling */
        .virtue-dots {
            display: flex;
            flex-shrink: 0;
        }

        .virtue-dots input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: #fff;
            /* White for unchecked virtues */
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin: 0 2px;
            cursor: pointer;
            border: 1px solid #7a7a7a;
            /* Grey border for virtue dots */
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .virtue-dots input[type="checkbox"].active {
            background-color: #7a7a7a;
            /* Darker grey for active virtues */
            border-color: #555;
            box-shadow: 0 0 3px rgba(122, 122, 122, 0.7);
        }

        .virtue-dots input[type="checkbox"].current-level {
            border: 2px solid #d4af37;
            /* Gold/brown border for current virtue level */
        }

        .virtue-dots input[type="checkbox"]:hover {
            transform: scale(1.1);
        }

        .virtue-dots input[type="checkbox"].active:hover {
            transform: scale(1.15);
        }


        /* General text input line style */
        .text-input-line {
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            outline: none;
            padding: 0 2px;
            font-size: 13px;
            /* Increased from 11.4px */
            color: #000;
            min-width: 30px;
            /* Ensure input is visible */
        }

        /* UPDATED: Style for the ability items to match image alignment */
        .ability-item {
            display: grid;
            grid-template-columns: 80px 1fr max-content;
            /* Reduced label column, flexible input, dots */
            align-items: center;
            /* Vertically align items in the grid row */
            padding: 1px 0;
            /* Keep some padding */
        }

        /* UPDATED: Style for the text inputs next to abilities (Talent, Skill, Knowledge) */
        .ability-text-input {
            width: 60px;
            /* Fixed shorter width for the input field itself */
            text-align: center;
            /* Center the text within the input */
            margin: 0 auto;
            /* Center the input within its grid cell */
        }

        /* UPDATED: Ability item labels - now matches attribute labels in size/weight and has fixed width */
        .ability-item label {
            white-space: nowrap;
            /* Prevent wrapping if label is too long for 80px, it will overflow */
            text-align: left;
            /* Ensure label is left-aligned within its grid cell */
            font-size: 1.1em;
            font-weight: bold;
            /* No margin-right here, grid handles spacing */
        }

        /* Removed ability-label-input-group as it's no longer needed for abilities */
        /* .ability-label-input-group {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        width: 120px;
    } */

        /* Virtue item labels - now matches attribute labels in size/weight */
        .virtue-item label {
            white-space: nowrap;
            flex-grow: 0;
            /* Prevent label from growing */
            flex-shrink: 0;
            margin-right: 5px;
            /* Space between label and dots */
            text-align: left;
            font-size: 1.1em;
            /* Set to match attribute labels */
            font-weight: bold;
            /* Set to match attribute labels */
        }

        /* Health item labels - now matches attribute labels in size/weight */
        .health-item-new label {
            font-weight: bold;
            /* Match font-weight to attributes */
            font-size: 1.1em;
            /* Match font-size to attributes */
            margin-right: 5px;
            flex-grow: 0;
            width: 80px;
            /* Fixed width for labels */
        }


        .total-checkbox {
            margin-left: 5px;
            width: 10px;
            height: 10px;
            border: 1px solid #000;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
            vertical-align: middle;
        }

        .total-checkbox:checked {
            background-color: #000;
        }

        /* Merits & Flaws Section */
        .merits-flaws-section {
            background-color: #e6d3b3;
            /* Consistent with main content sections */
            border: 1px solid #888;
            padding: 5px;
            margin-top: 5px;
            background-image:
                linear-gradient(-20deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0) 30%),
                radial-gradient(circle at 10% 90%, rgba(70, 20, 0, 0.04) 0%, rgba(70, 20, 0, 0) 50%);
            background-repeat: no-repeat;
            background-size: 100% 100%, 70px 70px;
            background-position: 0% 0%, 10% 90%;
        }

        .merits-flaws-content {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        /* Updated sub-section styling */
        .merits-sub-section,
        .flaws-sub-section,
        .other-traits-sub-section,
        .backgrounds-sub-section {
            flex: 1;
            border: 1px solid #a0a0a0;
            padding: 5px;
            background-color: #f0e6d6;
            /* Consistent with attribute columns */
            background-image:
                radial-gradient(circle at 75% 25%, rgba(139, 69, 19, 0.03) 0%, rgba(139, 69, 19, 0) 60%),
                linear-gradient(100deg, rgba(0, 0, 0, 0.01) 0%, rgba(0, 0, 0, 0) 40%);
            background-repeat: no-repeat;
            background-size: 60px 60px, 100% 100%;
            background-position: 75% 25%, 0% 0%;
        }

        .sub-section-title {
            background-color: #7a7a7a;
            color: #fff;
            padding: 3px 5px;
            font-weight: bold;
            margin-bottom: 5px;
            /* Increased border width and darker color */
            border: 2px solid #333;
            /* Changed from 1px solid #555 */
            text-shadow: 1px 1px 1px #000;
            /* Increased font size for sub-section titles */
            font-size: 1.2em;
            /* Adjusted from 1.1em */
        }

        .merit-item,
        .flaw-item,
        .trait-item,
        .background-item {
            /* Changed other-trait-item to trait-item */
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            gap: 5px;
            /* Space between input and button */
        }

        .merit-item label,
        .flaw-item label,
        .trait-item label,
        .background-item label {
            /* Changed other-trait-item to trait-item */
            white-space: nowrap;
            margin-right: 5px;
            font-weight: normal;
        }

        .merit-item input[type="text"],
        .flaw-item input[type="text"],
        .trait-item input[type="text"],
        .background-item input[type="text"] {
            /* Changed other-trait-item to trait-item */
            flex-grow: 1;
            font-size: 13px;
            /* Increased from 11.4px */
            padding: 1px 2px;
            background-color: #e0e0e0;
            border: 1px solid #888;
        }

        .add-field-btn,
        .delete-field-btn {
            display: block;
            width: 100%;
            padding: 5px;
            margin-top: 8px;
            background-color: #555;
            color: #fff;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1.14em;
            /* Decreased by 5% from 1.2em */
            transition: background-color 0.2s, transform 0.1s;
        }

        .add-field-btn:hover,
        .delete-field-btn:hover {
            background-color: #666;
            transform: translateY(-1px);
        }

        .add-field-btn:active,
        .delete-field-btn:active {
            background-color: #444;
            transform: translateY(0);
        }

        .delete-field-btn {
            width: auto;
            /* Allow button to size to content */
            margin-top: 0;
            /* Align with input */
            padding: 1px 5px;
            font-size: 0.912em;
            /* Decreased by 5% from 0.96em */
            background-color: #c00;
            border-color: #800;
        }

        .delete-field-btn:hover {
            background-color: #d00;
        }


        /* Health and Equipment */
        .health-equipment-combined-section {

            grid-template-columns: 1.7fr 1.3fr;

            gap: 5px;
            margin-top: 5px;

        /* Updated health-armor-box styling */
        .health-armor-box {

            /* Consistent with main content sections */
            border: 1px solid #888;
            padding: 5px;
            position: relative;
            /* For positioning the title */

                radial-gradient(circle at 10% 90%, rgba(70, 20, 0, 0.03) 0%, rgba(70, 20, 0, 0) 60%),
                linear-gradient(70deg, rgba(0, 0, 0, 0.01) 0%, rgba(0, 0, 0, 0) 30%);

            background-size: 70px 70px, 100% 100%;
            background-position: 10% 90%, 0% 0%;

            color: #fff;
            padding: 2px 5px;
            font-weight: bold;
            margin-bottom: 5px;

            /* Changed from 1px solid #555 */
            text-shadow: 1px 1px 1px #000;

            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom: none;

            /* Adjust to align with the top border of the parent */
            margin-top: 0;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-left: -5px;
            /* Extend to left edge */
            padding-left: 10px;
            width: calc(100% + 10px);

        .health-item-new {

            text-align: right;
            flex-shrink: 0;

        /* Health item checkbox styling - initial state */
        .health-item-new input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border: 1px solid #000;
            background-color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            /* Add transition for smoother visual changes */
            transition: background-color 0.15s ease-in-out, background-image 0.15s ease-in-out;

        /* State 1: Crossed out */
        .health-item-new input[type="checkbox"].crossed-out {
            background-image:

            background-size: 100% 100%;
            /* Ensure gradients cover the box */
            background-repeat: no-repeat;
            background-color: #fff;
            /* Keep background white */
        }

        /* State 2: Filled completely */
        .health-item-new input[type="checkbox"].filled {
            background-color: #000;
            border-color: #eee;
            background-image: none;
            /* Remove cross when filled */
        }

        .health-item-new input[type="text"] {

            /* Allow text input to fill available space */
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            outline: none;
            padding: 0 2px;
            font-size: 13px;
            /* Increased from 11.4px */
            color: #000;
            margin-left: 5px;

        /* New container for side-by-side strain and temporary status */

            gap: 10px;
            margin-top: 10px;
            padding-top: 5px;

            padding-right: 5px;

        .temp-status-section {
            flex: 1;
            padding-left: 5px;

            margin-bottom: 5px;
        }

        .armor-section-in-health {

            padding-top: 5px;
            border-top: 1px dashed #999;

        .armor-section-in-health .equipment-item-row {

            padding: 0;
            margin-bottom: 0;

        /* Updated equipment-box-weapons styling */
        .equipment-box-weapons {

            background-image:
                linear-gradient(50deg, rgba(0, 0, 0, 0.015) 0%, rgba(0, 0, 0, 0) 40%),

            background-position: 0% 0%, 80% 80%;

        .equipment-box-weapons .section-title {
            margin: -5px -5px 5px -5px;
            border: 2px solid #333;
            background-color: #7a7a7a;
            font-size: 1.2em;

        /* Updated equipment-item-group styling */
        .equipment-item-group {
            background-color: #f0e6d6;
            padding: 3px;
            border: 1px solid #a0a0a0;
            margin-bottom: 3px;
            background-image:
                radial-gradient(circle at 30% 60%, rgba(70, 20, 0, 0.02) 0%, rgba(70, 20, 0, 0) 45%);
            background-repeat: no-repeat;
            background-size: 40px 40px;
            background-position: 30% 60%;
        }

            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 3px;
        }

            font-weight: bold;

        }

        .equipment-item-row input[type="number"] {

        /* Increased width for "Bonus" and "Penalty" inputs */
        .equipment-item-row .input-short {

        .equipment-item-row .input-medium {

        .equipment-item-row .input-extra-long {

        .weapon-row-icon {

        /* Pistol icon (new) */
        .pistol-icon {
            background-color: transparent;
        }

        .pistol-icon path {
            fill: #000;
        }

        /* Original knife icon (retained for generic weapon, if needed elsewhere) */
        .knife-icon {
            background-color: transparent;
        }

        .knife-icon path {
            fill: #000;
        }

        /* Original gun icon (retained for generic weapon, if needed elsewhere) */

            background-color: transparent;
        }

            fill: #000;

        /* SVG for sword/melee icon */

            background-color: transparent;

            fill: #000;

        /* SVG for special weapon icon (star) */

            background-color: transparent;
        }

        .special-weapon-icon path {
            fill: #000;
        }

        /* Inventory Section Specific Styles */
        .inventory-section {
            background-color: #e6d3b3;
            border: 1px solid #888;
            padding: 5px;
            margin-top: 5px;
            background-image:
                radial-gradient(circle at 95% 5%, rgba(70, 20, 0, 0.05) 0%, rgba(70, 20, 0, 0) 70%),
                linear-gradient(-45deg, rgba(0, 0, 0, 0.01) 0%, rgba(0, 0, 0, 0) 30%);

            background-size: 80px 80px, 100% 100%;
            background-position: 95% 5%, 0% 0%;
        }

        .inventory-section .section-title {
            margin: -5px -5px 5px -5px;
            border: 2px solid #333;
            background-color: #7a7a7a;
            text-shadow: 1px 1px 1px #000;
            font-size: 1.2em;
        }

        .inventory-section textarea {
            width: calc(100% - 10px);
            height: 100px;
            border: 1px solid #000;
            background-color: #f0e6d6;
            resize: vertical;
            font-size: 13px;
            /* Increased from 11.4px */
            padding: 3px;
            box-sizing: border-box;
        }


        /* Experience box specific styles */
        .experience-box {
            background-color: #e6d3b3;
            border: 1px solid #888;
            padding: 5px;
            margin-top: 5px;
            background-image:
                linear-gradient(25deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0) 35%),

            background-size: 100% 100%, 60px 60px;
            background-position: 0% 0%, 15% 70%;

        .experience-box .section-title {

            border: 2px solid #333;
            background-color: #7a7a7a;
            font-size: 1.2em;
            text-shadow: 1px 1px 1px #000;

        .experience-box .exp-fields-top {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            margin-bottom: 5px;

        .experience-box .exp-fields-item {

            align-items: center;
            gap: 5px;

        .experience-box .exp-fields-item label {
            font-weight: bold;

        .experience-box .exp-fields-item input {
            width: 50px;
            text-align: center;
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            outline: none;
            padding: 0 2px;
            font-size: 13px;
            /* Increased from 11.4px */
            color: #000;
        }

        .experience-box textarea {
            width: calc(100% - 10px);
            height: 120px;
            border: 1px solid #000;
            background-color: #f0e6d6;
            resize: vertical;
            font-size: 13px;
            /* Increased from 11.4px */
            padding: 3px;
            box-sizing: border-box;
        }

        /* Loading indicator for Gemini API call */
        .loading-indicator {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 1.026em;
            color: #555;
        }

        /* Herb Usage Section Styles */
        .herb-usage-section {
            background-color: #e6d3b3;
            border: 1px solid #888;
            padding: 5px;
            margin-top: 5px;
            background-image:
                linear-gradient(135deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0) 40%),
                radial-gradient(circle at 80% 20%, rgba(139, 69, 19, 0.03) 0%, rgba(139, 69, 19, 0) 50%);
            background-repeat: no-repeat;
            background-size: 100% 100%, 60px 60px;
            background-position: 0% 0%, 80% 20%;
            text-align: center;
        }

        .herb-usage-section .section-title {
            margin: -5px -5px 5px -5px;
            border: 2px solid #333;
            background-color: #7a7a7a;
            font-size: 1.2em;
            text-shadow: 1px 1px 1px #000;
        }

        .herb-buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 8px 0;
        }

        .herb-btn {
            padding: 6px 12px;
            background-color: #28a745;
            color: white;
            border: 2px solid #1e7e34;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Metal Mania', cursive;
            font-size: 1em;
            text-shadow: 1px 1px 1px #000;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            min-width: 90px;
            box-sizing: border-box;
        }

        .herb-btn:hover {
            background-color: #218838;
            transform: translateY(-1px);
        }

        .herb-btn:active {
            background-color: #1e7e34;
            transform: translateY(0);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Specific herb button colors for visual distinction */
        .herb-btn.green-btn {}

        .herb-btn.red-blue-btn {
            background-color: #dc3545;
            border-color: #bd2130;
        }

        .herb-btn.red-blue-btn:hover {
            background-color: #c82333;
        }

        .herb-btn.red-blue-btn:active {
            background-color: #bd2130;
        }

        .herb-btn.green-blue-btn {
            background-color: #17a2b8;
            border-color: #117a8b;
        }

        .herb-btn.green-blue-btn:hover {
            background-color: #138496;
        }

        .herb-btn.green-blue-btn:active {
            background-color: #117a8b;
        }

        .herb-btn.green-green-blue-btn {
            background-color: #20c997;
            border-color: #189871;
        }

        .herb-btn.green-green-blue-btn:hover {
            background-color: #1aaf8c;
        }

        .herb-btn.green-green-blue-btn:active {
            background-color: #189871;
        }

        .herb-btn.green-green-red-btn {
            background-color: #fd7e14;
            border-color: #cb6510;
        }

        .herb-btn.green-green-red-btn:hover {
            background-color: #e66b0d;
        }

        .herb-btn.green-green-red-btn:active {
            background-color: #cb6510;
        }

        .herb-btn.red-green-blue-btn {
            background-color: #6f42c1;
            border-color: #563198;
        }

        .herb-btn.red-green-blue-btn:hover {
            background-color: #5f37a8;
        }

        .herb-btn.red-green-blue-btn:active {
            background-color: #563198;
        }

        .action-buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .action-button {
            padding: 8px 15px;
            background-color: #6c757d;
            color: white;
            border: 2px solid #545b62;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Metal Mania', cursive;
            font-size: 1.1em;
            text-shadow: 1px 1px 1px #000;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            min-width: 120px;
            box-sizing: border-box;
        }

        .action-button:hover {
            background-color: #5a6268;
            transform: translateY(-1px);
        }

        .action-button:active {
            background-color: #494f54;
            transform: translateY(0);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.5);

        #first-aid-spray-btn:active {

            display: block;
            margin-bottom: 5px;
        }

        /* Updated styling for temp-status-textarea */
        .temp-status-section #temp-status-textarea {

            width: 100%;
            height: 60px;
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            outline: none;
            padding: 0 2px;
            font-size: 13px;
            /* Increased from 11.4px */
            color: #000;
            resize: both;
            /* Changed from vertical to both */
            box-sizing: border-box;
            /* Ensure it can grow if flex parent allows */
            min-width: 100px;
            /* Give it a minimum width */
        }

        .health-status-sub-section input[type="number"] {
            width: calc(100% - 10px);
            background-color: #f0e6d6;
            border: 1px solid #000;
            padding: 3px;
            font-size: 13px;
            /* Increased from 11.4px */
            color: #000;
            box-sizing: border-box;
        }

        /* New styles for feedback messages */
        .feedback-message {
            text-align: center;
            margin-top: 10px;
            padding: 5px;
            background-color: #fffacd;
            color: #8b4513;
            border: 1px solid #d2b48c;
            border-radius: 3px;
            font-size: 0.9em;
            display: none;
        }

        /* Custom styling for message box (from previous model, adapted for existing feedback-message) */
        .message-box-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            /* Hidden by default */
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .message-box-overlay.show {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .message-box-overlay.success {
            background-color: #28a745;
            /* Green */
            color: white;
        }

        .message-box-overlay.error {
            background-color: #dc3545;
            /* Red */
            color: white;
        }

        .message-box-overlay.info {
            background-color: #6c757d;
            /* Grey */
            color: white;
        }

        /* Styling for XP add/spend buttons in Experience section */
        .exp-action-btn {
            padding: 4px 8px;
            background-color: #555;
            color: #fff;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Metal Mania', cursive;
            font-size: 0.9em;
            text-shadow: 1px 1px 1px #000;
            transition: background-color 0.2s, transform 0.1s;
        }

        .exp-action-btn:hover {
            background-color: #666;
            transform: translateY(-1px);
        }

        .exp-action-btn:active {
            background-color: #444;
            transform: translateY(0);
        }

        /* Style for the Clear Log button */
        .utility-button {
            padding: 4px 8px;
            background-color: #6c757d;
            color: white;
            border: 1px solid #545b62;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Metal Mania', cursive;
            font-size: 0.9em;
            text-shadow: 1px 1px 1px #000;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 5px;
            /* Added margin */
            width: 100%;
            /* Make it full width like other add/delete buttons */
        }

        .utility-button:hover {
            background-color: #5a6268;
            transform: translateY(-1px);
        }

        .utility-button:active {
            background-color: #494f54;
            transform: translateY(0);
        }

        .utility-button:disabled {
            background-color: #a0a0a0;
            border-color: #888888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>

            <div class="section-title">
                <svg class="icon" viewbox="0 0 24 24">
                    <path

            </div>
            <div class="exp-fields-top">
                <div class="exp-fields-item"><label>Total:</label> <input id="exp-total" readonly="" type="number"
                        value="0" /></div>
                <div class="exp-fields-item"><label>Spent:</label> <input id="exp-spent" readonly="" type="number"
                        value="0" /></div>

                    <label>Available:</label> <input id="exp-available" type="number" value="0" />

            </div>
            <!-- Removed XP Add/Spend controls based on user request -->
            <!-- Activity Log -->
            <label for="activityLog"
                style="font-weight: bold; display: block; margin-bottom: 5px; text-align: center; text-shadow: 0 0 2px #ffffff, 0 0 2px #ffffff;">Activity
                Log</label>
            <textarea class="resize-y" id="activityLog" placeholder="Your activity will be logged here..."
                style="height: 120px;"></textarea>
            <button class="utility-button" id="clearLogButton">Clear Log</button>
            <button class="utility-button" disabled="" id="undoLastChangeButton">Undo Last Change (XP)</button>
            <!-- NOTE FROM VLADO: Tva e mnogo grozno i hardcode-nato. Ideally trqbva da se vidi kak se handle-va updatevaneto na drugite promenlivi (primerno strengthlevel ili availablexp) i da se napravi sushtoto
      za vsichki textovi poleta kato Name, Age, etc. Moje bi shte e dobre da se napravi nqkakyv object kakto e allAttributes i toj da se save-a kato json. -->
            <button class="utility-button" id="save"
                onclick="saveCharacter(document.getElementById('char-name').value, 'myCharacter.txt', 'text/plain')">Save</button>
            <!-- Centralized Message Box for notifications -->
            <div class="message-box-overlay" id="messageBox"></div>
            <script>
                // Global XP variables (initialized from DOM on load)
                let availableXP = 0;
                let spentXP = 0;
                let totalXP = 0;

                // Attributes levels (9 total)
                let strengthLevel = 0;
                let dexterityLevel = 0;

                let staminaLevel = 0;
                let charismaLevel = 0;
                let manipulationLevel = 0;
                let appearanceLevel = 0;
                let perceptionLevel = 0;
                let intelligenceLevel = 0;
                let witsLevel = 0;

                // Abilities levels (30 total) - dynamic
                const abilities = {}; // Will store levels like abilities.athletics = 0, abilities.acrobatics = 0, etc.

                // Virtues levels (3 total)
                let conscienceLevel = 0;
                let selfcontrolLevel = 0;
                let courageLevel = 0;

                const MAX_LEVEL = 6; // Max level for all attributes, abilities, and virtues

                // Cost definitions: Index 0 is unused, index N is cost to reach level N from N-1
                // For example, attributeCostPattern[1] is the cost to go from Level 0 to Level 1
                const attributeCostPattern = [0, 5, 10, 15, 20, 25, 30];
                const abilityCostPattern = [0, 3, 6, 9, 12, 15, 18];

                // Define all attributes and their associated elements with direct getters/setters
                const allAttributes = [
                    { name: "Strength", levelGetter: () => strengthLevel, levelSetter: (level) => { strengthLevel = level; }, displayId: 'strengthLevelDisplay', costDisplayId: 'nextStrengthLevelCostDisplay', containerGroup: 'strength', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Dexterity", levelGetter: () => dexterityLevel, levelSetter: (level) => { dexterityLevel = level; }, displayId: 'dexterityLevelDisplay', costDisplayId: 'nextDexterityLevelCostDisplay', containerGroup: 'dexterity', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Stamina", levelGetter: () => staminaLevel, levelSetter: (level) => { staminaLevel = level; }, displayId: 'staminaLevelDisplay', costDisplayId: 'nextStaminaLevelCostDisplay', containerGroup: 'stamina', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Charisma", levelGetter: () => charismaLevel, levelSetter: (level) => { charismaLevel = level; }, displayId: 'charismaLevelDisplay', costDisplayId: 'nextCharismaLevelCostDisplay', containerGroup: 'charisma', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Manipulation", levelGetter: () => manipulationLevel, levelSetter: (level) => { manipulationLevel = level; }, displayId: 'manipulationLevelDisplay', costDisplayId: 'nextManipulationLevelCostDisplay', containerGroup: 'manipulation', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Appearance", levelGetter: () => appearanceLevel, levelSetter: (level) => { appearanceLevel = level; }, displayId: 'appearanceLevelDisplay', costDisplayId: 'nextAppearanceLevelCostDisplay', containerGroup: 'appearance', costArray: attributeCostPattern, type: 'attribute' }, // Re-added!
                    { name: "Perception", levelGetter: () => perceptionLevel, levelSetter: (level) => { perceptionLevel = level; }, displayId: 'perceptionLevelDisplay', costDisplayId: 'nextPerceptionLevelCostDisplay', containerGroup: 'perception', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Intelligence", levelGetter: () => intelligenceLevel, levelSetter: (level) => { intelligenceLevel = level; }, displayId: 'intelligenceLevelDisplay', costDisplayId: 'nextIntelligenceLevelCostDisplay', containerGroup: 'intelligence', costArray: attributeCostPattern, type: 'attribute' },
                    { name: "Wits", levelGetter: () => witsLevel, levelSetter: (level) => { witsLevel = level; }, displayId: 'witsLevelDisplay', costDisplayId: 'nextWitsLevelCostDisplay', containerGroup: 'wits', costArray: attributeCostPattern, type: 'attribute' },
                ];

                // Define all abilities (30 total) - Mapped to their data-group names
                const allAbilitiesList = [
                    "alertness", "athletics", "brawl", "dodge", "empathy", "expression", "intimidation", "leadership", "streetwise", "subterfuge",
                    "animalken", "drive", "etiquette", "firearms", "melee", "performance", "repair", "security", "stealth", "survival",
                    "bureaucracy", "computer", "enigmas", "investigation", "law", "linguistics", "medicine", "occult", "politics", "science"
                ];

                // Initialize ability levels to 0 and map to their display elements
                const allAbilities = allAbilitiesList.map(name => {
                    const normalizedName = name.toLowerCase().replace(/[^a-z0-9]/g, '');
                    abilities[`${normalizedName}Level`] = 0; // Initialize global ability level vars
                    return {
                        name: name.charAt(0).toUpperCase() + name.slice(1).replace(/([A-Z])/g, ' $1'), // Convert camelCase to Title Case for display
                        levelGetter: () => abilities[`${normalizedName}Level`],
                        levelSetter: (level) => { abilities[`${normalizedName}Level`] = level; },
                        costDisplayId: `next${normalizedName.charAt(0).toUpperCase() + normalizedName.slice(1)}LevelCostDisplay`, // Add costDisplayId for abilities
                        containerGroup: normalizedName,
                        costArray: abilityCostPattern,
                        type: 'ability'
                    };
                });


                // Define all virtues
                const allVirtues = [
                    { name: "Conscience", levelGetter: () => conscienceLevel, levelSetter: (level) => { conscienceLevel = level; }, displayId: 'conscienceLevelDisplay', containerGroup: 'conscience', type: 'virtue' },
                    { name: "Self-control", levelGetter: () => selfcontrolLevel, levelSetter: (level) => { selfcontrolLevel = level; }, displayId: 'selfcontrolLevelDisplay', containerGroup: 'selfcontrol', type: 'virtue' },
                    { name: "Courage", levelGetter: () => courageLevel, levelSetter: (level) => { courageLevel = level; }, displayId: 'courageLevelDisplay', containerGroup: 'courage', type: 'virtue' },
                ];


                // DOM references for XP fields
                const expTotalInput = document.getElementById('exp-total');
                const expSpentInput = document.getElementById('exp-spent');
                const expAvailableInput = document.getElementById('exp-available'); // Now editable

                // DOM references for healing section elements
                const currentStrainInput = document.getElementById('current-strain');
                const temporaryStatusEffectsTextarea = document.getElementById('temp-status-textarea');
                const inventoryTextarea = document.getElementById('inventory-textarea');
                const feedbackMessageArea = document.getElementById('feedback-message-area'); // Existing element for messages

                // Activity log
                const activityLog = document.getElementById('activityLog'); // Re-purposed briefing-textarea
                const clearLogButton = document.getElementById('clearLogButton');
                const undoButton = document.getElementById('undoLastChangeButton');


                let messageTimer; // To manage message display duration

                // Define WOUND_PROPERTIES here, inside the scope where DOM is guaranteed to be ready
                let WOUND_PROPERTIES;

                // Ordered list of wound levels to iterate through for damage application/healing
                const WOUND_LEVELS_ORDERED = ['bruised', 'hurt', 'injured', 'wounded', 'mauled', 'crippled', 'incapacitated'];

                // UNDO FUNCTIONALITY
                const undoStack = [];
                const MAX_UNDO_STATES = 10; // Increased to 10 undo steps


                /**
                 * Updates the enabled/disabled state of the undo button.
                 */
                function updateUndoButtonState() {
                    undoButton.disabled = undoStack.length === 0;
                }

                /**
                 * Logs an activity message to the activity log textarea.
                 * @param {string} message - The message to log.
                 */
                function logActivity(message) {
                    const now = new Date();
                    const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    activityLog.value += `[${timestamp}] ${message}\n`;
                    activityLog.scrollTop = activityLog.scrollHeight; // Scroll to bottom to show new entry
                }

                /**
                 * Captures the current state of XP and all attribute/ability levels
                 * and pushes it onto the undo stack.
                 */
                function saveStateForUndo() {
                    const skillLevelsSnapshot = {};
                    allAttributes.forEach(attr => {
                        skillLevelsSnapshot[attr.containerGroup] = attr.levelGetter();
                    });
                    allAbilities.forEach(ability => {
                        skillLevelsSnapshot[ability.containerGroup] = ability.levelGetter();
                    });

                    const state = {
                        availableXP: availableXP,
                        spentXP: spentXP,
                        skillLevels: skillLevelsSnapshot
                    };

                    if (undoStack.length >= MAX_UNDO_STATES) {
                        undoStack.shift(); // Remove the oldest state
                    }
                    undoStack.push(state);
                    console.log("State saved for undo. Stack size:", undoStack.length);
                    updateUndoButtonState();
                }

                /**
                 * Restores the previous state from the undo stack.
                 */
                function undoLastChange() {
                    if (undoStack.length === 0) {
                        showMessage("No changes to undo.", "info");
                        return;
                    }

                    const lastState = undoStack.pop();
                    availableXP = lastState.availableXP;
                    spentXP = lastState.spentXP;

                    allAttributes.forEach(attr => {
                        attr.levelSetter(lastState.skillLevels[attr.containerGroup]);
                    });
                    allAbilities.forEach(ability => {
                        ability.levelSetter(lastState.skillLevels[ability.containerGroup]);
                    });

                    updateExperienceFields();
                    renderAllSkillDots();
                    logActivity('Undid last XP-spending change.');
                    showMessage("Last change undone.", "success");
                    updateUndoButtonState();
                }


                // Function to update XP fields and recalculate total
                function updateExperienceFields() {
                    // When availableXP is changed manually, totalXP is updated
                    // When spentXP is changed by level up, totalXP is updated, and availableXP decreases
                    expAvailableInput.value = availableXP; // Ensure input reflects internal state
                    expSpentInput.value = spentXP;
                    totalXP = availableXP + spentXP;
                    expTotalInput.value = totalXP;
                }

                // Function to display temporary feedback messages (adapted to use existing feedbackMessageArea)
                function showMessage(message, type = 'info', duration = 3000) {
                    // Use feedbackMessageArea as the primary message display
                    feedbackMessageArea.textContent = message;
                    feedbackMessageArea.className = 'feedback-message message-box-overlay show'; // Apply common classes

                    // Add type-specific classes for styling
                    feedbackMessageArea.classList.remove('success', 'error', 'info'); // Clear previous types
                    if (type === 'success') {
                        feedbackMessageArea.classList.add('success');
                    } else if (type === 'error') {
                        feedbackMessageArea.classList.add('error');
                    } else { // Default to info
                        feedbackMessageArea.classList.add('info');
                    }

                    // Clear any existing timer and set a new one
                    clearTimeout(messageTimer);
                    messageTimer = setTimeout(() => {
                        feedbackMessageArea.classList.remove('show');
                        // Remove type classes after fading out
                        setTimeout(() => {
                            feedbackMessageArea.classList.remove('success', 'error', 'info');
                            feedbackMessageArea.textContent = '';
                        }, 300); // Allow fade-out transition to complete before clearing content/classes
                    }, duration);
                }


                /**
                 * Checks and consumes an item from inventory.
                 * Handles quantities (e.g., "ItemName (X)" -> "ItemName (X-1)").
                 * Preserves newlines and other content on the line.
                 * @param {string} item - The exact name of the item to consume (e.g., "GG", "First Aid Spray").
                 * @returns {boolean} - True if the item was found and consumed, false otherwise.
                 */
                function checkAndConsumeItem(item) {
                    console.log(`[Inventory] Attempting to consume: "${item}"`);
                    let inventoryContent = inventoryTextarea.value;
                    let lines = inventoryContent.split('\n');
                    let foundAndConsumed = false;

                    // Escape special characters in the item name for the regex, then trim
                    // This ensures items like "First Aid Spray" work correctly
                    const escapedItem = item.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

                    // Regex to find the item and its optional quantity within any part of a line.
                    // It looks for a word boundary before the item name and after, or start/end of string.
                    // It's more forgiving about surrounding text.
                    const itemRegex = new RegExp(`(\\b|^)(${escapedItem})(?:\\s*\\((\\d+)\\))?(\\b|$)`, 'i');

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i];
                        console.log(`[Inventory] Checking line ${i}: "${line}"`);
                        const match = line.match(itemRegex);

                        if (match) {
                            // match[0]: The full matched substring (e.g., " GG (2)" or "GG")
                            // match[1]: Pre-item boundary/start (e.g., " " or "")
                            // match[2]: The item name itself (e.g., "GG")
                            // match[3]: The numerical quantity (e.g., "2" or undefined)
                            // match[4]: Post-item boundary/end (e.g., " " or "")

                            const matchedItemFullString = match[0]; // The exact string that matched in the line
                            const matchedItemName = match[2];
                            let currentQuantity = match[3] ? parseInt(match[3]) : 1;

                            console.log(`[Inventory] Match found: Item="${matchedItemName}", Quantity=${currentQuantity}, Full Match="${matchedItemFullString}"`);

                            if (currentQuantity > 1) {
                                currentQuantity--;
                                const newEntryString = `${matchedItemName} (${currentQuantity})`;
                                // Replace only the matched item part with the new quantity
                                lines[i] = line.replace(matchedItemFullString, newEntryString);
                                logActivity(`Consumed one "${item}". Inventory updated to "${newEntryString}".`);
                            } else {
                                // Quantity is 1 or no quantity was specified. Remove the entire item instance.
                                // Replace the full matched item string with an empty string.
                                lines[i] = line.replace(matchedItemFullString, '').trim(); // Trim after replacement
                                if (lines[i].length === 0) { // If the line became empty after removal
                                    lines.splice(i, 1); // Remove the empty line from the array
                                    i--; // Adjust index due to removal
                                }
                                logActivity(`Consumed one "${item}". Item removed from inventory.`);
                            }
                            foundAndConsumed = true;
                            break; // Item consumed, exit loop
                        }
                    }

                    if (foundAndConsumed) {
                        // Re-join lines, filtering out any lines that are now completely empty
                        inventoryTextarea.value = lines.filter(line => line.trim() !== '').join('\n');
                        console.log("[Inventory] Final inventory state:", inventoryTextarea.value);
                        return true;
                    }
                    console.log(`[Inventory] Item "${item}" not found in inventory.`);
                    showMessage(`You do not have "${item}" in your inventory.`, 'error');
                    return false;
                }


                /**
                 * Updates a single checkbox's visual state based on its `data-state` attribute.
                 * @param {HTMLElement} checkbox - The checkbox element.
                 */
                function updateCheckboxVisuals(checkbox) {
                    if (!checkbox) {
                        console.warn("Attempted to update visuals on a null checkbox.");
                        return;
                    }
                    const state = parseInt(checkbox.dataset.state || '0'); // Get the visual state (0, 1, or 2)
                    checkbox.classList.remove('crossed-out', 'filled');
                    checkbox.checked = false; // Default to unchecked for visual consistency

                    if (state === 1) {
                        checkbox.classList.add('crossed-out');
                    } else if (state === 2) {
                        checkbox.classList.add('filled');
                        checkbox.checked = true; // Visually check the box when filled
                    }
                }

                /**
                 * Calculates the damage points induced by current strain.
                 * @returns {number} The total strain damage points.
                 */
                function calculateStrainDamagePoints() {
                    const currentStrain = parseInt(currentStrainInput.value) || 0;
                    // Each 10 strain points = 1 effective damage point
                    const strainDamage = Math.floor(currentStrain / 10);
                    console.log("Calculated Strain Damage Points (from strain input):", strainDamage);
                    return strainDamage;
                }

                /**
                 * Updates the visual states of wound checkboxes based on manual settings and current strain.
                 * Manual settings are the base, and strain layers on top.
                 */
                function updateStrainVisuals() {
                    const strainDamagePoints = calculateStrainDamagePoints();
                    let remainingStrainPointsToApply = strainDamagePoints;
                    console.log(`[Strain Visuals] Applying ${strainDamagePoints} strain damage points.`);

                    // Phase 1: Reset all visual states to match their manual states first
                    for (const level of WOUND_LEVELS_ORDERED) {
                        const prop = WOUND_PROPERTIES[level];
                        if (prop && prop.checkbox) {
                            // The visual data-state starts by mirroring the manual data-state
                            prop.checkbox.dataset.state = prop.checkbox.dataset.stateManual;
                            updateCheckboxVisuals(prop.checkbox); // Apply the visual update based on manual state
                        }
                    }

                    // Phase 2: Apply remainingStrainPointsToApply to the visual states (data-state),
                    // starting from the lowest wound and escalating if possible, without affecting data-state-manual.
                    for (const level of WOUND_LEVELS_ORDERED) {
                        if (remainingStrainPointsToApply <= 0) break; // No more strain to apply

                        const prop = WOUND_PROPERTIES[level];
                        if (!prop || !prop.checkbox) continue;

                        let currentVisualState = parseInt(prop.checkbox.dataset.state);

                        // Logic to apply strain to unmarked or partially marked wounds
                        if (currentVisualState === 0) { // If currently unmarked visually
                            if (remainingStrainPointsToApply >= prop.filled_points && prop.filled_points > 0) {
                                prop.checkbox.dataset.state = '2'; // Fill it due to strain
                                remainingStrainPointsToApply -= prop.filled_points;
                                console.log(`  Strain filled ${level}. Remaining strain points: ${remainingStrainPointsToApply}`);
                            } else if (remainingStrainPointsToApply >= prop.crossed_points && prop.crossed_points > 0) {
                                prop.checkbox.dataset.state = '1'; // Cross it out due to strain
                                remainingStrainPointsToApply -= prop.crossed_points;
                                console.log(`  Strain crossed ${level}. Remaining strain points: ${remainingStrainPointsToApply}`);
                            }
                        } else if (currentVisualState === 1) { // If currently crossed out visually (from manual or previous strain)
                            // Can strain push it to 'filled'?
                            const pointsToReachFilledFromCrossed = prop.filled_points - prop.crossed_points;
                            if (pointsToReachFilledFromCrossed > 0 && remainingStrainPointsToApply >= pointsToReachFilledFromCrossed) {
                                prop.checkbox.dataset.state = '2'; // Fill it due to strain escalation
                                remainingStrainPointsToApply -= pointsToReachFilledFromCrossed;
                                console.log(`  Strain escalated ${level} from crossed to filled. Remaining strain points: ${remainingStrainPointsToApply}`);
                            }
                        }
                        // If currentVisualState is 2 (filled), strain cannot increase it further.

                        updateCheckboxVisuals(prop.checkbox); // Apply the new visual state
                    }
                }


                /**
                 * Resets only the manual wound checkboxes (`data-state-manual`) to state 0 (unmarked).
                 * This affects ALL wound checkboxes including Incapacitated.
                 */
                function resetManualWoundCheckboxes() {
                    for (const level in WOUND_PROPERTIES) {
                        const prop = WOUND_PROPERTIES[level];
                        if (prop && prop.checkbox) {
                            prop.checkbox.dataset.stateManual = '0'; // Reset manual state
                        }
                    }
                    console.log("[Healing] All manual wound checkboxes states reset.");
                }

                /**
                 * Main function to apply healing effects.
                 * Prioritizes healing worst manual wounds first and then updates strain.
                 * @param {number} woundsHealed - Amount of health points (HP) to heal.
                 * @param {number} strainHealed - Amount of strain points (SP) to heal.
                 * @param {string[]} statusEffects - Array of status effects to apply.
                 */
                function applyHealing(woundsHealed, strainHealed, statusEffects = []) {
                    console.log(`[Healing] Applying healing: HP=${woundsHealed}, SP=${strainHealed}, Status=${statusEffects.join(', ')}`);

                    // 1. Heal Strain
                    let currentStrain = parseInt(currentStrainInput.value) || 0;
                    currentStrainInput.value = Math.max(0, currentStrain - strainHealed);

                    // 2. Heal Manual Wounds (from worst to best)
                    let healingPointsRemaining = woundsHealed;

                    // Iterate wound levels from most severe to least severe (reverse order)
                    for (let i = WOUND_LEVELS_ORDERED.length - 1; i >= 0; i--) {
                        if (healingPointsRemaining <= 0) break; // Stop if no healing points left

                        const level = WOUND_LEVELS_ORDERED[i];
                        const prop = WOUND_PROPERTIES[level];
                        if (!prop || !prop.checkbox) continue;

                        let currentStateManual = parseInt(prop.checkbox.dataset.stateManual);

                        if (currentStateManual === 2) { // If currently 'filled' manually
                            // If it's incapacitated (no 'crossed' state), heal directly to unmarked
                            if (prop.crossed_points === 0 && healingPointsRemaining >= prop.filled_points) {
                                prop.checkbox.dataset.stateManual = '0'; // Change to 'unmarked'
                                healingPointsRemaining -= prop.filled_points;
                                console.log(`  Healed ${level} from filled to unmarked. Remaining HP: ${healingPointsRemaining}`);
                            } else if (prop.crossed_points > 0) { // For wounds with a 'crossed' state
                                const costToDowngradeToCrossed = prop.filled_points - prop.crossed_points;
                                if (healingPointsRemaining >= costToDowngradeToCrossed) {
                                    prop.checkbox.dataset.stateManual = '1'; // Change to 'crossed'

                            }

                            // Try to downgrade from crossed to unmarked
                            if (healingPointsRemaining >= prop.crossed_points) {
                                prop.checkbox.dataset.stateManual = '0'; // Change to 'unmarked'

                        }

                            } else {

                            }
                        } else {

                    // After healing manual wounds and strain, update the combined visual display

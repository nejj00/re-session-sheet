                        if (data[key] !== undefined) input.value = data[key];
                    });
                    document.querySelectorAll('.armor-section-in-health input[type="text"], .armor-section-in-health input[type="number"]').forEach((input, i) => {
                        const key = `armor-field-${i}`;
                        if (data[key] !== undefined) input.value = data[key];
                    });

                    // Wound notes
                    document.querySelectorAll('.health-item-new input[type="text"]').forEach((input, i) => {
                        const key = `wound-note-${i}`;
                        if (data[key] !== undefined) input.value = data[key];
                    });

                    // Checkboxes
                    document.querySelectorAll('input[type="checkbox"]').forEach((checkbox, i) => {
                        const key = checkbox.dataset.group ? `${checkbox.dataset.group}-${checkbox.dataset.index}` : `checkbox-${i}`;
                        if (data[key]) {
                            checkbox.checked = data[key].checked;
                            checkbox.className = data[key].classes;
                        }
                    });

                    // Photo
                    const img = document.querySelector(".photo-box img");
                    if (img && data.uploadedPhoto) {
                        img.src = data.uploadedPhoto;
                    }
                }

                function exportToJSONFile() {
                    const data = collectSheetData();
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "character_sheet.json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }

                function importFromJSONFile(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        try {
                            const data = JSON.parse(e.target.result);
                            loadSheetData(data);
                            alert("Character sheet loaded successfully!");
                        } catch {
                            alert("Failed to parse JSON.");
                        }
                    };
                    reader.readAsText(file);
                }
            </script>
            <script>
                let traitCounter = 0;
                let backgroundCounter = 0;

                function addTraitRow(value = '', id = '') {
                    const container = document.getElementById('traits-container');
                    const textarea = document.createElement('textarea');
                    textarea.className = 'trait-textarea';
                    if (!id) {
                        id = 'trait-' + (++traitCounter);
                    }
                    textarea.id = id;
                    textarea.value = value;
                    container.appendChild(textarea);
                }

                function addBackgroundRow(value = '', id = '') {
                    const container = document.getElementById('backgrounds-container');
                    const textarea = document.createElement('textarea');
                    textarea.className = 'background-textarea';
                    if (!id) {
                        id = 'background-' + (++backgroundCounter);
                    }
                    textarea.id = id;
                    textarea.value = value;
                    container.appendChild(textarea);
                }

                function saveCharacterData() {
                    const data = {};

                    document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => {
                        if (!el.id) {
                            el.id = 'auto-' + Math.random().toString(36).substr(2, 9);
                        }
                        data[el.id] = el.value;
                    });

                    document.querySelectorAll('input[type="checkbox"]').forEach(el => {
                        let key = "";
                        if (el.dataset.group && el.dataset.index) {
                            key = `dot-${el.dataset.group}-${el.dataset.index}`;
                        } else {
                            if (!el.id) {
                                el.id = 'checkbox-auto-' + Math.random().toString(36).substr(2, 9);
                            }
                            key = `checkbox-${el.id}`;
                        }
                        data[key] = el.checked;
                    });

                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'character.json';
                    a.click();
                }

                function loadCharacterData(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const data = JSON.parse(e.target.result);
                        for (const key in data) {
                            const value = data[key];

                            if (key.startsWith("dot-")) {
                                const [, group, index] = key.split("-");
                                const checkbox = document.querySelector(`input[type="checkbox"][data-group="${group}"][data-index="${index}"]`);
                                if (checkbox) checkbox.checked = value;
                            } else if (key.startsWith("checkbox-")) {
                                const id = key.replace("checkbox-", "");
                                const checkbox = document.getElementById(id);
                                if (checkbox) checkbox.checked = value;
                            } else {
                                let el = document.getElementById(key);
                                if (!el) {
                                    if (key.startsWith("trait-")) {
                                        addTraitRow(value, key);
                                    } else if (key.startsWith("background-")) {
                                        addBackgroundRow(value, key);
                                    }
                                } else {
                                    el.value = value;
                                }
                            }
                        }

                        alert("Character loaded!");
                    };
                    reader.readAsText(file);
                }
            </script>
</body>
